<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AppleTvSamsung</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="art/tvos-icons.css">
  <script defer src="sound-files.js"></script>
  <script defer src="settings.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <main class="screen">
    <section id="home" class="home" aria-label="Главный экран">
      <div class="backdrop" aria-hidden="true">
        <img id="artwork" alt="" draggable="false" src="art/sugar.jpg">
      </div>
      <div class="apps-wallpaper" aria-hidden="true"></div>
      <h1 class="hero-title">Sugar</h1>
      <time id="home-clock" class="home-clock"></time>
      <button id="hero-preview" class="hero-preview" type="button" aria-expanded="false">
        <span id="hero-preview-label">На весь экран</span>
      </button>
      <div class="shelf" aria-label="Приложения">
        <div class="shelf-track">
          <div class="tile-row favorites">
            <button class="tile" type="button" data-app="tv" aria-label="Apple TV"><span class="tile-frame"><span class="tile-icon tv-icon" aria-hidden="true"><i></i>tv</span></span><span class="tile-name" aria-hidden="true">Apple TV</span></button>
            <button class="tile" type="button" data-app="arcade" aria-label="Arcade"><span class="tile-frame"><span class="tile-icon arcade-icon" aria-hidden="true"><i></i></span></span><span class="tile-name" aria-hidden="true">Arcade</span></button>
            <button class="tile" type="button" data-app="photos" aria-label="Фото"><span class="tile-frame"><span class="tile-icon photos-icon" aria-hidden="true"></span></span><span class="tile-name" aria-hidden="true">Фото</span></button>
            <button class="tile" type="button" data-app="facetime" aria-label="FaceTime"><span class="tile-frame"><span class="tile-icon video-icon" aria-hidden="true"></span></span><span class="tile-name" aria-hidden="true">FaceTime</span></button>
            <button class="tile" type="button" data-app="music" aria-label="Музыка"><span class="tile-frame"><span class="tile-icon symbol-icon music-icon" aria-hidden="true">♫</span></span><span class="tile-name" aria-hidden="true">Музыка</span></button>
            <button class="tile" type="button" data-app="fitness" aria-label="Фитнес"><span class="tile-frame"><span class="tile-icon fitness-icon" aria-hidden="true"></span></span><span class="tile-name" aria-hidden="true">Фитнес</span></button>
          </div>
          <div class="tile-row utilities">
            <button id="all-apps" class="tile" type="button" aria-label="Все приложения"><span class="tile-frame"><span class="tile-icon grid-icon" aria-hidden="true"></span></span><span class="tile-name" aria-hidden="true">Все приложения</span></button>
            <button class="tile" type="button" data-app="localVideo" aria-label="Моё видео"><span class="tile-frame"><span class="tile-icon play-icon" aria-hidden="true"></span></span><span class="tile-name" aria-hidden="true">Моё видео</span></button>
            <button class="tile" type="button" data-app="youtube" aria-label="YouTube"><span class="tile-frame"><span class="tile-icon youtube-icon" aria-hidden="true"></span></span><span class="tile-name" aria-hidden="true">YouTube</span></button>
            <button class="tile" type="button" data-app="netflix" aria-label="Netflix"><span class="tile-frame"><span class="tile-icon netflix-icon" aria-hidden="true"></span></span><span class="tile-name" aria-hidden="true">Netflix</span></button>
            <button class="tile" type="button" data-app="browser" aria-label="Браузер"><span class="tile-frame"><span class="tile-icon compass-icon" aria-hidden="true"></span></span><span class="tile-name" aria-hidden="true">Браузер</span></button>
            <button id="home-settings" class="tile" type="button" aria-label="Настройки"><span class="tile-frame"><span class="tile-icon symbol-icon gear-icon" aria-hidden="true">⚙</span></span><span class="tile-name" aria-hidden="true">Настройки</span></button>
          </div>
        </div>
      </div>
      <p id="notice" class="notice" role="status" hidden></p>
    </section>
    <section id="gallery" class="gallery" aria-labelledby="gallery-title" hidden>
      <header>
        <h1 id="gallery-title">Приложения Samsung</h1>
        <div class="gallery-actions">
          <button id="gallery-settings" type="button">Настройки</button>
          <button id="back" type="button">Назад</button>
        </div>
      </header>
      <p id="gallery-status" role="status"></p>
      <div id="applications" class="applications"></div>
    </section>
    <section id="settings" class="settings" aria-labelledby="settings-title" hidden>
      <header class="settings-heading">
        <button id="settings-back" class="settings-back" type="button" aria-label="Назад">‹</button>
        <h1 id="settings-title">Настройки</h1>
      </header>
      <aside class="settings-brand">
        <div class="settings-logo" aria-hidden="true"><span class="tv-icon"><i></i>tv</span></div>
        <p id="settings-description" class="settings-help" aria-live="polite"></p>
      </aside>
      <div class="settings-menu">
        <div id="settings-list" class="settings-list"></div>
        <p id="settings-detail" class="settings-detail" hidden></p>
      </div>
    </section>
  </main>
</body>
</html>
